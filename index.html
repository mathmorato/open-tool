<!DOCTYPE html>
<html lang="pt-BR" data-theme="system">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Open Tool — Ferramentas Universais 100% Client-Side</title>
  <meta name="description" content="Open Tool: Plataforma de ferramentas client-side. Converta documentos para Markdown, gere QR Codes e muito mais — diretamente no navegador, sem servidores.">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/tools/hub.css">
  <link rel="stylesheet" href="css/tools/qrcode.css">
  <link rel="stylesheet" href="css/tools/img2vector.css">

  <!-- Bibliotecas 100% Client-Side Locais -->
  <script src="js/lib/qrcodegen.js"></script>
  <script src="js/lib/imagetracer.js"></script>

  <!-- Fontes modernas Google Fonts (Inter e JetBrains Mono) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>

  <!-- Topbar / Cabeçalho Principal -->
  <header class="topbar">
    <div class="topbar-container">
      <a href="#" class="brand" aria-label="Open Tool Página Inicial">
        <div class="brand-icon" aria-hidden="true">
          <svg class="brand-logo-svg" viewBox="0 0 208 128" fill="none" xmlns="http://www.w3.org/2000/svg" aria-label="Open Tool Logo">
            <!-- Contorno externo retangular com cantos arredondados espessos -->
            <rect x="5" y="5" width="198" height="118" rx="18" fill="none" stroke="currentColor" stroke-width="10" stroke-linejoin="round"/>
            
            <!-- Letra M robusta e geométrica -->
            <path d="M30 98V30H46L64 58L82 30H98V98H82V54L64 82L46 54V98H30Z" fill="currentColor"/>
            
            <!-- Seta para baixo -->
            <path d="M140 30H158V68H176L149 100L122 68H140V30Z" fill="currentColor"/>
          </svg>
        </div>
        <div class="brand-title">
          <span>Open <span class="accent">Tool</span></span>
          <span class="version-badge" id="header-version">v.2.2.0</span>
        </div>
      </a>

      <div class="topbar-actions">
        <!-- Seletor de Tema (Dark / Light) -->
        <button id="theme-toggle" class="btn-icon" aria-label="Alternar tema claro/escuro" title="Alternar modo claro/escuro">
          <svg id="theme-icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="4"/>
            <path d="M12 2v2"/>
            <path d="M12 20v2"/>
            <path d="m4.93 4.93 1.41 1.41"/>
            <path d="m17.66 17.66 1.41 1.41"/>
            <path d="M2 12h2"/>
            <path d="M20 12h2"/>
            <path d="m6.34 17.66-1.41 1.41"/>
            <path d="m19.07 4.93-1.41 1.41"/>
          </svg>
          <svg id="theme-icon-moon" style="display: none;" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>
          </svg>
        </button>

        <!-- Link para Repositório -->
        <a href="https://github.com/mathmorato/open-tool" target="_blank" rel="noopener noreferrer" class="btn-icon" aria-label="Código Fonte no GitHub" title="Ver código no GitHub">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
            <path d="M15 22v-4a4.8 4.8 0 0 0-1-3.5c3 0 6-2 6-5.5.08-1.25-.27-2.48-1-3.5.28-1.15.28-2.35 0-3.5 0 0-1 0-3 1.5-2.64-.5-5.36-.5-8 0C6 2 5 2 5 2c-.3 1.15-.3 2.35 0 3.5A5.403 5.403 0 0 0 4 9c0 3.5 3 5.5 6 5.5-.39.49-.68 1.05-.85 1.65-.17.6-.22 1.23-.15 1.85v4"/>
            <path d="M9 18c-4.51 2-5-2-7-2"/>
          </svg>
        </a>
      </div>
    </div>
  </header>

  <!-- Tool Navbar — Seletor de Ferramentas -->
  <div id="tool-navbar-container"></div>

  <!-- Conteúdo Central -->
  <main class="main-content">
    <div class="app-main-container">

      <!-- Viewport de Ferramentas — HTML de cada ferramenta é injetado aqui -->
      <div id="tool-viewport" class="tool-viewport"></div>

    </div>
  </main>

  <!-- Rodapé Institucional e SemVer -->
  <footer class="footer app-footer">
    <div class="footer-container">
      <div class="footer-privacy">
        <span>Seus dados nunca saem do seu dispositivo. Zero telemetria.</span>
      </div>

      <div class="footer-links">
        <span class="version-badge footer-version" id="footer-version">v.2.2.0</span>
        <a href="https://github.com/mathmorato/open-tool" target="_blank" rel="noopener noreferrer">GitHub</a>
        <span>Licença MIT</span>
      </div>
    </div>
  </footer>

  <!-- Carregamento Modular & Híbrido: Servidor/GitHub Pages (ES Modules) e Abertura Local file:/// (Bundle) -->
  <script>
    if (window.location.protocol === 'file:') {
      const bundleScript = document.createElement('script');
      bundleScript.src = 'js/bundle.js';
      document.body.appendChild(bundleScript);
    }
  </script>
  <script type="module">
    if (window.location.protocol !== 'file:') {
      import('./js/main.js');
    }
  </script>
</body>
</html>
